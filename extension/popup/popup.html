<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FormGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="28" height="28">
    <h1>FormGuard</h1>
    <div class="langs" role="group" aria-label="Language / भाषा">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
    </div>
  </header>

  <!-- 1. One plain sentence about THIS page -->
  <section id="statusCard" class="status-card" aria-live="polite">
    <div id="statusIcon" class="status-icon" aria-hidden="true">…</div>
    <div>
      <div id="statusTitle" class="status-title"></div>
      <div id="statusSub" class="status-sub"></div>
    </div>
  </section>

  <!-- 2. Shown only until "all websites" is on -->
  <section id="turnOnCard" class="turnon" hidden>
    <button id="turnOnBtn" type="button" class="primary big" data-i18n="turnOn"></button>
    <p class="note" data-i18n="turnOnNote"></p>
  </section>

  <p id="privacyLine" class="privacy"></p>
  <button id="recheck" type="button" class="link" data-i18n="recheck"></button>

  <!-- 3. Everything else, out of the way -->
  <details id="adv">
    <summary data-i18n="adv"></summary>

    <label class="switch-line"><input type="checkbox" id="pause"> <span data-i18n="pause"></span></label>
    <label class="switch-line"><input type="checkbox" id="liveHint"> <span data-i18n="liveHint"></span></label>
    <label class="field-line"><span data-i18n="textSize"></span>
      <select id="textSize">
        <option value="normal" data-i18n="sizeNormal"></option>
        <option value="large" data-i18n="sizeLarge"></option>
        <option value="xlarge" data-i18n="sizeXLarge"></option>
      </select>
    </label>
    <label class="switch-line"><input type="checkbox" id="contrast"> <span data-i18n="contrast"></span></label>
    <label class="switch-line"><input type="checkbox" id="autoClear"> <span><span data-i18n="autoClear"></span> <em data-i18n="autoClearNote"></em></span></label>
    <label class="switch-line"><input type="checkbox" id="aiEnabled"> <span><span data-i18n="ai"></span> <em data-i18n="aiNote"></em></span></label>
    <div id="aiBox" class="ai-box" hidden>
      <p data-i18n="aiBox"></p>
      <label><span data-i18n="server"></span> <input type="url" id="serverUrl" spellcheck="false"></label>
    </div>

    <div class="row small"><button id="openReport" type="button" data-i18n="privacyReport"></button></div>
    <p id="unknownLine" class="meta"></p>
    <p class="meta" data-i18n="unknownNote"></p>
    <div class="row small"><button id="exportUnknown" type="button" data-i18n="unknownSave"></button></div>

    <h2 data-i18n="logTitle"></h2>
    <p id="statLine" class="meta"></p>
    <ul id="log"></ul>
    <div class="row small">
      <button id="exportLog" type="button" data-i18n="exportLog"></button>
      <button id="clearLog" type="button" data-i18n="clearLog"></button>
    </div>
  </details>

  <script src="popupText.js"></script>
  <script src="popup.js"></script>
</body>
</html>
